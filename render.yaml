services:
  - type: web
    name: stock-earnings-alerts
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --timeout 120 --bind 0.0.0.0:$PORT app:app
    disk:
      name: firegame-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SECRET_KEY
        generateValue: true          # Render generates a secure random key once; stable across deploys
      - key: DATABASE_PATH
        value: /var/data/firegame.db
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false                  # You supply this in the Render dashboard
      - key: SMTP_PASSWORD
        sync: false                  # You supply this in the Render dashboard
      - key: SMTP_FROM
        sync: false                  # Same as SMTP_USER
